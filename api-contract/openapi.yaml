openapi: 3.0.3
info:
  title: Autograder API
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      responses:
        '200':
          description: Access token
  /api/v1/assignments/{id}/submissions:
    post:
      summary: Upload a submission
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Submission queued
  /api/v1/submissions/{id}:
    get:
      summary: Get submission status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission status
  /api/v1/submissions/{id}/report:
    get:
      summary: Get a graded report
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grading report
        '409':
          description: Submission is not graded