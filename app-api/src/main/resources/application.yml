spring:
  application:
    name: app-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autograder}
    username: ${SPRING_DATASOURCE_USERNAME:autograder}
    password: ${SPRING_DATASOURCE_PASSWORD:autograder}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:autograder}
    password: ${RABBITMQ_PASSWORD:autograder}

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:gradeflow-local-development-secret-change-me-32}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
